name: update-rmm
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rmm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unduh RMM
        run: |
          mkdir -p data/waves
          code=$(curl -sSL --retry 3 --retry-delay 5 --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
            -H "Accept: text/plain,*/*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Referer: https://www.bom.gov.au/climate/mjo/" \
            -o data/waves/rmm.txt.tmp -w '%{http_code}' \
            https://www.bom.gov.au/clim_data/IDCKGEM000/rmm.74toRealtime.txt) || code="curl-error"
          lines=$(wc -l < data/waves/rmm.txt.tmp 2>/dev/null || echo 0)
          echo "HTTP: $code | Baris: $lines"
          if [ "$code" = "200" ] && [ "$lines" -gt 1000 ]; then
            mv data/waves/rmm.txt.tmp data/waves/rmm.txt
          else
            echo "::error::Unduhan gagal. Awal respons:"
            head -c 400 data/waves/rmm.txt.tmp 2>/dev/null || true
            rm -f data/waves/rmm.txt.tmp
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/waves/rmm.txt
          git diff --staged --quiet || (git commit -m "Perbarui RMM" && git push)
